name: C120 Portable Installer

on:
  push:
    paths:
      - 'contrib/tapo-c120/stock-install/**'
      - '.github/workflows/c120-installer.yml'
  pull_request:
    paths:
      - 'contrib/tapo-c120/stock-install/**'
      - '.github/workflows/c120-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: contrib/tapo-c120/stock-install/requirements.txt
      - run: python -m pip install -r contrib/tapo-c120/stock-install/requirements.txt
      - run: python contrib/tapo-c120/stock-install/test_c120_install.py
      - run: python contrib/tapo-c120/stock-install/test_c120_prepare_raw.py
      - run: python contrib/tapo-c120/stock-install/test_tapo_client.py
      - run: python contrib/tapo-c120/stock-install/test_c120_tftp.py
      - run: python contrib/tapo-c120/stock-install/c120_install.py --check-kit
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          python contrib/tapo-c120/stock-install/test_c120_packed_images.py
          python contrib/tapo-c120/stock-install/test_c120_rescue_guard.py
          python contrib/tapo-c120/stock-install/test_c120_stock_recovery_flash.py
